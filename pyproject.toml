[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "portfree"
version = "0.2.0"
description = "Find free TCP ports. Stdlib only."
requires-python = ">=3.9"
readme = "README.md"

[project.scripts]
portfree = "portfree.cli:main"

[tool.setuptools.packages.find]
include = ["portfree*"]
